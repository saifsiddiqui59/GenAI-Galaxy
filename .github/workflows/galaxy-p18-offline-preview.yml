name: Galaxy P18 offline adaptive learning preview
# Read-only bundle build. No Azure, Supabase, paid model or deployment credentials.
on:
  push:
    branches: [feat/p18-adaptive-learning-flow, fix/p18-uncertain-answer-anywhere]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galaxy-p18-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-preview:
    if: github.repository == 'saifsiddiqui59/GenAI-Galaxy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build self-contained zero-cost HTML
        run: python scripts/build_adaptive_preview.py
      - name: Install pinned Playwright
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Test portable HTML in desktop and mobile Chromium
        run: python tests/preview_adaptive_browser.py
      - name: Upload interactive HTML and guest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GenAI-Galaxy-P18-Adaptive-Learning-Test
          path: |
            artifacts/adaptive-learning-preview.html
            artifacts/p18-desktop.png
            artifacts/p18-mobile.png
          if-no-files-found: error
          retention-days: 7
