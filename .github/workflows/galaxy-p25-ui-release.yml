name: Galaxy P25 existing-site secure plans and account release
on:
  workflow_dispatch:
    inputs:
      confirm:
        type: string
        required: true
        description: 'Type PUBLISH_GALAXY_P25 to publish only three existing UI files'
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  validate:
    if: >-
      github.repository == 'saifsiddiqui59/GenAI-Galaxy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH_GALAXY_P25') ||
       (github.event_name == 'issue_comment' && github.event.issue.number == 111 &&
        github.event.comment.user.id == 80577424 && github.event.comment.body == 'PUBLISH_GALAXY_P25'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin reviewed P25 assets and run offline checks
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object app.js)" == '5f1eda93b53db4d57097d2b0cc4b278b25cab5ed' ]] || exit 1
          [[ "$(git hash-object index.html)" == 'ff67f8180c4115a5d51983ae7fb6d1311ed4afbb' ]] || exit 1
          [[ "$(git hash-object styles.css)" == '27c93b48908e9cc2b1c286c22ab639d260fcd87a' ]] || exit 1
          node --check app.js
          node tests/test_engine.cjs
          node tests/test_auth_sync.cjs
          python -m unittest discover -s tests -p 'test_p25_platform_control.py' -v
          ! grep -Eiq 'service_role|AZURE_SPEECH_KEY|SUPABASE_SERVICE_ROLE_KEY' index.html styles.css
  publish:
    needs: validate
    if: >-
      github.repository == 'saifsiddiqui59/GenAI-Galaxy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH_GALAXY_P25') ||
       (github.event_name == 'issue_comment' && github.event.issue.number == 111 &&
        github.event.comment.user.id == 80577424 && github.event.comment.body == 'PUBLISH_GALAXY_P25'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: dev
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: galaxy-p25-existing-site
      cancel-in-progress: false
    env:
      ACCOUNT: ${{ vars.GALAXY_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved source, identity and destination
        env:
          CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACCOUNT" == 'gengalaxy1429841605' ]] || exit 1
          [[ "${CLIENT,,}" == '737d67b7-4984-48bb-bb1f-5f62599f645c' ]] || exit 1
          [[ -n "$TENANT" && -n "$SUBSCRIPTION" ]] || exit 1
          [[ "$(git hash-object app.js)" == '5f1eda93b53db4d57097d2b0cc4b278b25cab5ed' ]] || exit 1
          [[ "$(git hash-object index.html)" == 'ff67f8180c4115a5d51983ae7fb6d1311ed4afbb' ]] || exit 1
          [[ "$(git hash-object styles.css)" == '27c93b48908e9cc2b1c286c22ab639d260fcd87a' ]] || exit 1
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Back up, upload, verify and roll back all three files on failure
        shell: bash
        run: |
          set -euo pipefail
          rg='GenAI_Galaxy'; acct='gengalaxy1429841605'
          id="$(az storage account show -g "$rg" -n "$acct" --query id -o tsv)"
          [[ "$id" == */resourceGroups/GenAI_Galaxy/providers/Microsoft.Storage/storageAccounts/gengalaxy1429841605 ]] || exit 1
          enabled="$(az storage account blob-service-properties show -g "$rg" --account-name "$acct" --query staticWebsite.enabled -o tsv)"
          [[ "${enabled,,}" == true ]] || exit 1
          tmp="$(mktemp -d)"; mkdir -p "$tmp/previous" "$tmp/verified"
          files=(app.js index.html styles.css)
          for file in "${files[@]}"; do
            az storage blob download --account-name "$acct" --auth-mode login --container-name '$web' --name "$file" --file "$tmp/previous/$file" --overwrite true --only-show-errors >/dev/null
          done
          complete=0
          rollback() {
            if [[ "$complete" != 1 ]]; then
              for file in "${files[@]}"; do
                az storage blob upload --account-name "$acct" --auth-mode login --container-name '$web' --name "$file" --file "$tmp/previous/$file" --overwrite true --only-show-errors >/dev/null || true
              done
              echo '::error::P25 publish failed; previous files restored where possible'
            fi
            rm -rf "$tmp"
          }
          trap rollback EXIT
          for file in "${files[@]}"; do
            case "$file" in
              app.js) content_type='application/javascript' ;;
              index.html) content_type='text/html' ;;
              styles.css) content_type='text/css' ;;
            esac
            az storage blob upload --account-name "$acct" --auth-mode login --container-name '$web' --name "$file" --file "$file" --overwrite true --content-type "$content_type" --content-cache-control 'no-cache,max-age=0' --only-show-errors >/dev/null
            az storage blob download --account-name "$acct" --auth-mode login --container-name '$web' --name "$file" --file "$tmp/verified/$file" --overwrite true --only-show-errors >/dev/null
            cmp "$file" "$tmp/verified/$file"
          done
          complete=1
          echo 'Three P25 frontend assets verified; all other website assets untouched.'
          echo 'https://gengalaxy1429841605.z29.web.core.windows.net/' >> "$GITHUB_STEP_SUMMARY"
      - name: Logout
        if: always()
        run: az logout >/dev/null 2>&1 || true
