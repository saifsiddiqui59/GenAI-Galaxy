name: Galaxy V6.10 Real Walking Skull Master Visual QA (no cloud)
on:
  pull_request:
    paths:
      - 'experience/**'
      - 'tests/p35_v6_browser.py'
      - '.github/workflows/galaxy-v610-walking-skull-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v610-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_GALAXY_ANATOMY: '1'
      VITE_GALAXY_NATIVE_ANATOMICAL_LIMBS: '1'
      GALAXY_V6_NATIVE: '1'
      GALAXY_V6_ANATOMY: '1'
      GALAXY_WALKING_EXPECT: '1'
      GALAXY_V6_ARTIFACTS: ${{ github.workspace }}/verification/screenshots
      GALAXY_V6_STAGE: ${{ github.workspace }}/v610-stage
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic real anatomical character
        run: |
          npm ci --prefix experience --no-audit --no-fund
          npm run --prefix experience build
      - name: Stage isolated no-key local preview (never touch Azure)
        shell: bash
        run: |
          mkdir -p "$GALAXY_V6_STAGE/previews/galaxy-3d-v6"
          GALAXY_SOURCE_ROOT="$GITHUB_WORKSPACE" GALAXY_STAGE="$GALAXY_V6_STAGE/previews/galaxy-3d-v6" bash scripts/p16/stage-preview.sh
      - name: Install local Chromium
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install chromium
      - name: Render real foot-planted walking Skull Master and validate desktop/mobile planet collection
        run: python tests/p35_v6_browser.py
      # Research-only V6.11 actor evidence. Uses NO Azure, paid models or releases.
      # Run on the experimental draft branch only; do not alter V6.10 for others.
      - name: Retrieve pinned third-party skinned rig for isolated V6.11 inspection
        if: github.head_ref == 'feat/v611-cinematic-skullmaster-rebuild-20261031'
        run: |
          set -euo pipefail
          mkdir -p experience/public/research verification/v611-actor
          curl --fail --location --retry 2 --max-time 110 \
            'https://pub-63ab27389d044634a73e89c1a0c6d4a6.r2.dev/free-library/3d-models/skeleton-gunslinger/skeleton-gunslinger.glb' \
            --output experience/public/research/v611-skeleton-gunslinger.glb
          echo 'd200c0716355d50a48b34fc17e0eceeea8609e47f357c16c18df4886c89526f9  experience/public/research/v611-skeleton-gunslinger.glb' | sha256sum --check
          node experience/scripts/audit-skinned-rig.mjs experience/public/research/v611-skeleton-gunslinger.glb > verification/v611-actor/rig-byte-audit.json
      - name: Capture real idle and walking actor at desktop and two mobile sizes
        if: github.head_ref == 'feat/v611-cinematic-skullmaster-rebuild-20261031'
        shell: bash
        run: |
          set -euo pipefail
          cd experience
          ./node_modules/.bin/vite --host 127.0.0.1 --port 4177 --strictPort \
            > "$GITHUB_WORKSPACE/verification/v611-actor/vite.log" 2>&1 &
          cd "$GITHUB_WORKSPACE"
          python tests/p36_v611_candidate_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galaxy-v610-visual-qa
          path: verification/
          retention-days: 14
          if-no-files-found: ignore
