name: Galaxy owner-approved AI workflow command bridge
# Only issue #183, created by exact owner user ID, may dispatch existing
# MANUAL protected workflows. No push/PR trigger, no provider/API credentials.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch-approved-owner-command:
    if: >-
      github.repository == 'saifsiddiqui59/GenAI-Galaxy' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.number == 183 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.id == 80577424 &&
      github.actor == 'saifsiddiqui59'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Accept exact release SHA and green main CI only
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'saifsiddiqui59/GenAI-Galaxy' &&
             "$GITHUB_REF" == 'refs/heads/main' &&
             "$GITHUB_EVENT_NAME" == 'issue_comment' ]] || exit 1
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$EVENT_SHA" ]] || {
            echo '::error::Source checkout differs from exact owner command commit'; exit 1;
          }
          current="$(gh api repos/saifsiddiqui59/GenAI-Galaxy/git/ref/heads/main --jq '.object.sha')"
          [[ "$current" == "$EVENT_SHA" ]] || {
            echo '::error::main moved; stale release command rejected'; exit 1;
          }
          success="$(gh run list -R saifsiddiqui59/GenAI-Galaxy \
            --workflow galaxy-ci.yml --branch main --event push --limit 25 \
            --json headSha,conclusion \
            --jq "[.[] | select(.headSha == \"$EVENT_SHA\" and .conclusion == \"success\")] | length")"
          [[ "$success" =~ ^[0-9]+$ && "$success" -gt 0 ]] || {
            echo '::error::No successful exact-source 3/3 GitHub main validation'; exit 1;
          }
          case "$COMMENT" in
            "DEPLOY_BACKEND_$EVENT_SHA")
              # Existing workflow targets only the pinned isolated Galaxy
              # Azure Function and regional model. Protected dev OIDC, secret
              # validations and no-always-ready checks remain authoritative.
              gh workflow run galaxy-p3-flex-deploy.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=DEPLOY
              echo 'Owner requested protected, existing-only Galaxy backend deployment.'
              ;;
            "TEST_RLS_$EVENT_SHA")
              # Existing workflow creates then removes Galaxy-only temporary
              # test users. It NEVER invokes the paid LLM.
              gh workflow run galaxy-ephemeral-rls.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=TEST
              echo 'Owner requested protected two-user Galaxy RLS acceptance.'
              ;;
            "SMOKE_NOCHARGE_$EVENT_SHA")
              gh workflow run galaxy-ai-readonly-release-smoke.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=READONLY
              echo 'Owner requested unauthenticated read-only API acceptance.'
              ;;
            "PREVIEW_AI_$EVENT_SHA")
              # Only an isolated nested prefix on the existing owner-approved
              # account. Downstream manual workflow retains protected dev OIDC.
              gh workflow run galaxy-ai-preview-p53.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=PREVIEW
              echo 'Owner requested isolated AI frontend preview publication.'
              ;;
            "DIAG_BACKEND_$EVENT_SHA")
              gh workflow run galaxy-ai-runtime-diagnostics.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=DIAGNOSE
              echo 'Owner requested read-only existing Azure Function runtime diagnostics.'
              ;;
            "SCALE_FLEX_2048_$EVENT_SHA")
              gh workflow run galaxy-p57-flex-memory.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=SCALE_2048
              echo 'Owner requested existing-only no-idle 2048 MB Flex rightsize.'
              ;;
            "PREVIEW_AI_P61_$EVENT_SHA")
              gh workflow run galaxy-ai-preview-p61.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=PREVIEW_P61
              echo 'Owner requested isolated P61 source-matched frontend publication.'
              ;;
            "TEST_AI_ONE_$EVENT_SHA")
              # Require at least two green no-charge run checks on the exact
              # main SHA before the one-evaluator/one-tutor paid test.
              healthy="$(gh run list --workflow galaxy-ai-readonly-release-smoke.yml \
                --branch main --event workflow_dispatch --limit 20 \
                --json headSha,conclusion \
                --jq "[.[] | select(.headSha == \"$EVENT_SHA\" and .conclusion == \"success\")] | length")"
              [[ "$healthy" =~ ^[0-9]+$ && "$healthy" -ge 2 ]] || {
                echo '::error::Two independent successful no-charge hosted smokes required'; exit 1;
              }
              gh workflow run galaxy-ephemeral-live-ai.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=TEST
              echo 'Owner requested at most one real evaluator and tutor call in protected dev.'
              ;;
            "DIAG_COLDSTART_$EVENT_SHA")
              gh workflow run galaxy-p63-coldstart-nocharge.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=READONLY
              echo 'Owner requested zero-token cold-start tolerant anonymous endpoint diagnosis.'
              ;;
            "DIAG_HTTP_PHASES_$EVENT_SHA")
              gh workflow run galaxy-p65-http-phase-readonly.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=READONLY
              echo 'Owner requested existing-only HTTP/TLS/TTFB plus free platform metric diagnosis.'
              ;;
            "DIAG_LONG_NOCHARGE_$EVENT_SHA")
              gh workflow run galaxy-p66-long-anonymous.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=LONG_READONLY
              echo 'Owner requested one-shot long anonymous Function startup diagnosis.'
              ;;
            "ROLLBACK_FLEX_512_$EVENT_SHA")
              gh workflow run galaxy-p57-flex-memory.yml -R saifsiddiqui59/GenAI-Galaxy \
                --ref main -f confirm=ROLLBACK_512
              echo 'Owner requested restore existing Galaxy Flex to 512 MB.'
              ;;
            *)
              echo '::error::Unsupported exact owner command; no workflow dispatched'
              exit 1
              ;;
          esac
