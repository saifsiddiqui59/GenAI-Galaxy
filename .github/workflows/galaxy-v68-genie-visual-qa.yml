name: Galaxy V6.8 Original Genie Visual QA (no cloud)
on:
  pull_request:
    paths:
      # V6.8 is archived; its sprite assertions cannot pass the V6.10 walking
      # character by design. Keep this workflow for explicit/manual legacy QA.
      - 'experience/public/models/original-genie.svg'
      - '.github/workflows/galaxy-v68-genie-visual-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v68-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  visual-qa:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feat/v68-') || startsWith(github.head_ref, 'chore/v68-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITE_GALAXY_ANATOMY: '1'
      GALAXY_V6_ANATOMY: '1'
      GALAXY_GENIE_EXPECT: '1'
      GALAXY_V6_ARTIFACTS: ${{ github.workspace }}/verification/screenshots
      GALAXY_V6_STAGE: ${{ github.workspace }}/v68-stage
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic real anatomical character
        run: |
          npm ci --prefix experience --no-audit --no-fund
          npm run --prefix experience build
      - name: Stage isolated no-key local preview (never touch Azure)
        shell: bash
        run: |
          mkdir -p "$GALAXY_V6_STAGE/previews/galaxy-3d-v6"
          GALAXY_SOURCE_ROOT="$GITHUB_WORKSPACE" GALAXY_STAGE="$GALAXY_V6_STAGE/previews/galaxy-3d-v6" bash scripts/p16/stage-preview.sh
      - name: Install local Chromium
        run: |
          python -m pip install playwright==1.57.0 Pillow==11.3.0
          python -m playwright install chromium
      - name: Render original floating Genie and validate desktop/mobile planet collection
        run: python tests/p35_v6_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: galaxy-v68-visual-qa
          path: verification/
          retention-days: 14
          if-no-files-found: ignore
