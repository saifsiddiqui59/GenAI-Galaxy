name: Galaxy P43 hosted public auth and anonymous RPC Playwright acceptance
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type VERIFY_GALAXY_P43_AUTH_PUBLIC'
        required: true
        type: string
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  public-auth-qa:
    if: >-
      github.repository == 'saifsiddiqui59/GenAI-Galaxy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.confirm == 'VERIFY_GALAXY_P43_AUTH_PUBLIC') ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.number == 147 &&
        github.event.comment.user.id == 80577424 &&
        github.event.comment.body == 'VERIFY_GALAXY_P43_AUTH_PUBLIC'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Chromium
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Run live anonymous role checks and login-first GUI
        run: python tests/hosted_p43_public_auth.py
