name: Galaxy P40 zero-cost hosted guest technical acceptance
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      confirm:
        required: true
        type: string
        description: 'Type VERIFY_P40_GUEST to run public read-only acceptance'
permissions:
  contents: read
jobs:
  hosted-guest:
    if: >-
      github.repository == 'saifsiddiqui59/GenAI-Galaxy' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.confirm == 'VERIFY_P40_GUEST') ||
       (github.event_name == 'issue_comment' && github.event.issue.number == 155 &&
        github.event.comment.user.id == 80577424 && github.event.comment.body == 'VERIFY_P40_GUEST'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: galaxy-p40-guest-acceptance
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reviewed, exact public source and offline tests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object app.js)" == 'f2808f1013df7c329627c6f1ded13f8aeeda8802' ]] || exit 1
          [[ "$(git hash-object index.html)" == 'd03d0a6f5b7e3238b95d1f12256e91de703e0e71' ]] || exit 1
          [[ "$(git hash-object features/offline-misconceptions.js)" == '8d0a64515f2951e2d8c15fb56948adf1b92e9562' ]] || exit 1
          node --check app.js
          node tests/test_p39_misconception_guard.cjs
          node tests/test_p38_eval_identity.cjs
      - name: Install pinned browser-only dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install chromium
      - name: Inspect live production public guest experience
        run: python tests/p40_hosted_guest_acceptance.py
      - name: Retain real hosted QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Galaxy-P40-Hosted-Guest-Screens
          path: artifacts/p40/*.png
          if-no-files-found: ignore
          retention-days: 7
