name: Galaxy V4 validation
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'fix/**']
permissions:
  contents: read
jobs:
  static-content-and-learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify curriculum, authored depth, security invariants
        run: python -m unittest discover -s tests -v
      - name: Verify adaptive engine logic
        run: node tests/test_engine.cjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check speech/azure-speech-adapter.js
