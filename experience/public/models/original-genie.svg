          <radialGradient id="genie-world"><stop stop-color="#eefbff"/><stop offset=".37" stop-color="#acb7ff"/><stop offset=".72" stop-color="#8f74eb"/><stop offset="1" stop-color="#231a6b"/></radialGradient>
          <linearGradient id="genie-sack" x1="0" x2="1" y2="1"><stop stop-color="#f0bd73"/><stop offset="1" stop-color="#8e4c7a"/></linearGradient>
