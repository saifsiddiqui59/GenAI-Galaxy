<?xml version="1.0" encoding="utf-8"?>
<!-- Original Genie illustration, reused from commit 0ca9cc8. -->
<svg class="genie-art" role="img" aria-labelledby="genie-title genie-desc" viewBox="0 0 480 430" xmlns="http://www.w3.org/2000/svg"><title id="genie-title">Original GenAI Galaxy Genie</title><desc id="genie-desc">A turquoise and violet Genie offering a glowing knowledge planet with magical mist</desc><style>.genie-character{transform-origin:240px 250px;animation:original-genie-breathe 4.5s ease-in-out infinite}.genie-trail{animation:original-genie-trail 3.6s ease-in-out infinite}.genie-left-arm{transform-origin:189px 232px;animation:original-genie-wave 3.3s ease-in-out infinite alternate}.genie-right-arm{transform-origin:289px 232px;animation:original-genie-wave 3.3s .65s ease-in-out infinite alternate-reverse}.genie-sparkles{animation:original-genie-stars 2s ease-in-out infinite alternate}.genie-gift-world{transform-origin:242px 202px;animation:original-genie-offer 3.8s ease-out both}@keyframes original-genie-breathe{50%{transform:translateY(-7px)}}@keyframes original-genie-trail{50%{opacity:.6;transform:translateY(5px)}}@keyframes original-genie-wave{50%{transform:rotate(7deg)}}@keyframes original-genie-stars{to{opacity:.38}}@keyframes original-genie-offer{from{opacity:0;transform:translateY(45px) scale(.45)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
